name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.6
        required: true
        default: v1.0.6

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Run macOS smoke tests
        run: swift run TokenTrackerSmokeTests

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_BUILD: ${{ github.run_number }}
          APP_ARCHS: arm64 x86_64
        run: bash scripts/build_app.sh

      - name: Verify app bundle
        run: swift scripts/verify_app_bundle.swift ".build/Tokki.app"

      - name: Package DMG
        shell: bash
        run: |
          mkdir -p dist
          DMG="Tokki-${{ steps.version.outputs.version }}-macOS.dmg"
          hdiutil create \
            -volname "Tokki" \
            -srcfolder ".build/Tokki.app" \
            -ov \
            -fs HFS+ \
            -format UDZO \
            "dist/${DMG}"
          # Record the file's name, not the path it was built under: whoever checks a
          # downloaded DMG runs shasum -c beside it, not from this repo's layout.
          cd dist
          shasum -a 256 "${DMG}" > "${DMG}.sha256"
          shasum -a 256 -c "${DMG}.sha256"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tokki-${{ steps.version.outputs.version }}-macOS
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.rid }} zip
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${env:GITHUB_REF_NAME}"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # AssemblyVersion takes numbers only, so drop the leading v and any
          # prerelease suffix rather than failing the publish on a tag like v1.2.0-rc1.
          $appVersion = ($version -replace '^v', '') -replace '-.*$', ''
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Windows smoke tests
        run: dotnet run --project windows/TokenTracker.Windows.Tests/TokenTracker.Windows.Tests.csproj

      - name: Publish Windows app
        run: >
          dotnet publish windows/TokenTracker.Windows/TokenTracker.Windows.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:PublishReadyToRun=false
          /p:Version=${{ steps.version.outputs.app_version }}
          /p:AssemblyVersion=${{ steps.version.outputs.app_version }}.${{ github.run_number }}
          /p:FileVersion=${{ steps.version.outputs.app_version }}.${{ github.run_number }}
          -o artifacts/Tokki-Windows-${{ matrix.rid }}

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path artifacts/Tokki-Windows-${{ matrix.rid }}/* `
            -DestinationPath "dist/Tokki-Windows-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip" `
            -Force
          $zip = "dist/Tokki-Windows-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $name = Split-Path $zip -Leaf
          # LF, not the CRLF Out-File writes: shasum/sha256sum read the filename
          # literally, so a trailing CR sends them looking for a name that ends in one
          # and every downloaded checksum fails to verify on macOS and Linux.
          # .NET file APIs use the process working directory, which is not PowerShell's
          # location, so resolve the path before handing it over.
          $shaPath = [System.IO.Path]::GetFullPath((Join-Path (Get-Location).Path "$zip.sha256"))
          [System.IO.File]::WriteAllText($shaPath, "$hash  $name" + [char]10)
          $bytes = [System.IO.File]::ReadAllBytes($shaPath)
          if ($bytes -contains 13) {
            throw "checksum file contains a carriage return"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tokki-Windows-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Build Linux deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Debian sorts a `~` suffix before the release, so v1.2.0-rc1 -> 1.2.0~rc1.
          DEB_VERSION="${VERSION#v}"
          echo "deb_version=${DEB_VERSION//-/\~}" >> "$GITHUB_OUTPUT"

      - name: Run Linux tests
        run: python3 -m unittest discover -s linux/tests -v

      - name: Build deb
        env:
          TOKKI_VERSION: ${{ steps.version.outputs.deb_version }}
        run: bash linux/packaging/build_deb.sh

      # Install what is about to ship and ask it its version, the Linux
      # counterpart of verifying the app bundle and the exe's version stamp.
      - name: Install and verify deb
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y "./dist/tokki_${{ steps.version.outputs.deb_version }}_all.deb"
          reported="$(tokki --version)"
          expected="Tokki ${{ steps.version.outputs.deb_version }}"
          if [ "$reported" != "$expected" ]; then
            echo "installed tokki reports '$reported', expected '$expected'" >&2
            exit 1
          fi

      - name: Package release asset
        shell: bash
        run: |
          DEB="Tokki-Linux-${{ steps.version.outputs.version }}_all.deb"
          mv "dist/tokki_${{ steps.version.outputs.deb_version }}_all.deb" "dist/${DEB}"
          # File name only, LF-terminated, so sha256sum -c works beside the download.
          cd dist
          sha256sum "${DEB}" > "${DEB}.sha256"
          sha256sum -c "${DEB}.sha256"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tokki-Linux-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-linux
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Tokki ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
