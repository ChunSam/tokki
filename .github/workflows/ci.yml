name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build + smoke tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The two local version defaults are coupled by hand — build_app.sh stamps the
      # macOS bundle, the csproj stamps the Windows assembly — and nothing but the
      # deploy notes said so. Cheap enough to run before the build, and it lives in a
      # required job so drift blocks the merge rather than surfacing at the next release.
      - name: Check version defaults agree
        run: |
          app=$(grep -m1 '^APP_VERSION=' scripts/build_app.sh | sed 's/.*:-//; s/}.*//')
          win=$(grep -m1 '<Version>' windows/TokenTracker.Windows/TokenTracker.Windows.csproj \
            | sed 's/.*<Version>//; s|</Version>.*||')
          # Empty on both sides would otherwise "agree": a rename or a reformat must
          # fail loudly instead of silently switching the check off.
          if [ -z "$app" ] || [ -z "$win" ]; then
            echo "could not read a version default (build_app.sh='$app', csproj='$win')" >&2
            exit 1
          fi
          if [ "$app" != "$win" ]; then
            echo "version defaults disagree: build_app.sh=$app, csproj=$win" >&2
            exit 1
          fi
          echo "version defaults agree: $app"

      # The docs tell the reader to point `statusLine.command` straight at the
      # bridge script, and the build instructions name build_app.sh the same way.
      # A dropped exec bit makes both fail with "permission denied", and nothing
      # else here would notice: CI runs build_app.sh through bash, and this repo
      # has core.fileMode=false, so a local chmod never reaches a commit.
      - name: Check documented scripts are executable
        run: |
          # Not named `status`: that is read-only in zsh, so the snippet stays
          # runnable by hand outside the bash this step gets.
          missing=0
          for script in scripts/build_app.sh scripts/claude-statusline-bridge.sh scripts/utm-windows-ps.sh; do
            if [ ! -x "$script" ]; then
              echo "$script is documented as run directly but is not executable" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Build
        run: swift build

      - name: Smoke tests
        run: swift run TokenTrackerSmokeTests

      # Release-path smoke: assemble the same .app the release workflow ships and
      # check it carries its own resources, so a packaging break is caught on every
      # PR instead of only when someone installs a DMG (the Windows job has the
      # equivalent publish smoke below).
      - name: Build app bundle (release-path smoke)
        run: bash scripts/build_app.sh

      - name: Verify app bundle
        run: swift scripts/verify_app_bundle.swift ".build/Tokki.app"

  linux:
    name: Linux tests + deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Linux port has its own local version default; keep it with the other two.
      - name: Check Linux version default agrees
        run: |
          app=$(grep -m1 '^APP_VERSION=' scripts/build_app.sh | sed 's/.*:-//; s/}.*//')
          linux=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' linux/tokki/__init__.py)
          if [ -z "$app" ] || [ -z "$linux" ]; then
            echo "could not read a version default (build_app.sh='$app', linux='$linux')" >&2
            exit 1
          fi
          if [ "$app" != "$linux" ]; then
            echo "version defaults disagree: build_app.sh=$app, linux/tokki/__init__.py=$linux" >&2
            exit 1
          fi
          echo "version defaults agree: $app"

      - name: Check Linux scripts are executable
        run: |
          missing=0
          for script in linux/packaging/build_deb.sh scripts/claude-statusline-bridge.sh; do
            if [ ! -x "$script" ]; then
              echo "$script is documented as run directly but is not executable" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Core tests
        run: python3 -m unittest discover -s linux/tests -v

      - name: Build deb (release-path smoke)
        run: bash linux/packaging/build_deb.sh

      # Install the package through apt, so its Depends must resolve on a real
      # Ubuntu, then load the GTK app module from the installed location.
      - name: Install and verify deb
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/tokki_*_all.deb
          tokki --version
          python3 -c "import sys; sys.path.insert(0, '/usr/lib/tokki'); import tokki.app"

      # Draw the details window on a virtual display with the dependencies the deb
      # pulled in. A missing binding (python3-gi-cairo) breaks every bar and chart
      # at draw time, which only a real draw shows.
      - name: GUI smoke (details window)
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python3 linux/tests/gui_smoke.py "${{ runner.temp }}/gui-smoke"

      - name: Upload GUI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-smoke
          path: ${{ runner.temp }}/gui-smoke/
          if-no-files-found: ignore

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core smoke tests
        run: dotnet run --project windows/TokenTracker.Windows.Tests/TokenTracker.Windows.Tests.csproj

      - name: Build WinForms app
        run: dotnet build windows/TokenTracker.Windows/TokenTracker.Windows.csproj -c Release

      # Release-path smoke: exercise the same self-contained single-file publish
      # the release workflow uses (windows-release.yml), so a publish-only quirk
      # is caught on every PR instead of surfacing only at release. win-x64 only
      # (primary target); win-arm64 remains validated by the release workflow.
      - name: Publish WinForms app (release-path smoke)
        run: >
          dotnet publish windows/TokenTracker.Windows/TokenTracker.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:PublishReadyToRun=false
          /p:Version=0.0.0
          /p:AssemblyVersion=0.0.0.${{ github.run_number }}
          /p:FileVersion=0.0.0.${{ github.run_number }}
          -o ${{ runner.temp }}/publish-smoke

      # The version only matters if it survives into the published exe, which is
      # what Copy Diagnostics reads back. Assert the stamp landed rather than that
      # the flags parsed.
      - name: Verify published version stamp
        shell: pwsh
        run: |
          $exe = Join-Path "${{ runner.temp }}/publish-smoke" "TokenTracker.Windows.exe"
          $stamped = (Get-Item $exe).VersionInfo.FileVersion
          $expected = "0.0.0.${{ github.run_number }}"
          if ($stamped -ne $expected) {
            throw "published exe reports '$stamped', expected '$expected'"
          }
          Write-Host "published exe reports $stamped"
